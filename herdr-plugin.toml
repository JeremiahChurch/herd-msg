id = "herd-msg"
name = "Herd Messages"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Durable messages between coding sessions"
platforms = ["linux"]

[[panes]]
id = "messages"
title = "Messages"
placement = "overlay"
command = ["herd-msg", "watch"]

[[actions]]
id = "open-messages"
title = "Open Messages"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "herd-msg", "--entrypoint", "messages"]
